# Teacher Model Training Configuration (Phase 1)

model:
  name: "meta-llama/Llama-3.1-8B-Instruct"
  device_map: "auto"
  torch_dtype: "bfloat16"
  load_in_8bit: false
  use_flash_attention: true

training:
  output_dir: "./checkpoints/teacher"
  num_iterations: 50000
  batch_size: 4
  gradient_accumulation_steps: 8
  learning_rate: 1.0e-5
  warmup_steps: 100
  max_grad_norm: 1.0
  logging_steps: 10
  save_steps: 1000
  eval_steps: 500
  
  # GRPO specific
  grpo_beta: 0.1
  grpo_gamma: 0.99
  
generation:
  max_new_tokens: 1024
  temperature: 0.7
  top_p: 0.9
  top_k: 50
  do_sample: true
  num_return_sequences: 1

data:
  problem_categories:
    - math
    - logic
    - commonsense
  difficulty_range: [1, 5]
  validation_split: 0.1

logging:
  use_wandb: true
  wandb_project: "metacog-reasoning"
  wandb_entity: null
  log_level: "INFO"

seed: 42
